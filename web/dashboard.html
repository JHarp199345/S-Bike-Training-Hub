<!doctype html><html><head><meta charset="utf-8"><title>S-Bike Training Hub · Fitness Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
 :root{color-scheme:dark}
 [hidden]{display:none!important}
 body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,Roboto,"Helvetica Neue",sans-serif}
 main{max-width:1080px;margin:0 auto;padding:22px 16px 40px}
 h1{font-size:28px;margin:0}.sub{color:var(--muted)} a{color:var(--info)}
 h2{font-size:13px;letter-spacing:1.6px;color:var(--muted);margin:26px 0 8px}
 .card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;overflow-x:auto}
 .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
 .rings{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
 .ring{text-align:center;background:var(--deep);border-radius:12px;padding:10px 6px}
 .ring svg{width:96px;height:96px}.ring b{display:block;font-size:13px;color:var(--text2);margin-top:4px}.ring small{display:block;color:var(--muted);font-size:12px}
 .means{color:var(--text2);font-size:13px;margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
 .means b{color:var(--text)}
 .verdicts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
 .sport-response summary{cursor:pointer;list-style:none;min-height:130px}.sport-response summary::-webkit-details-marker{display:none}.sport-response summary:focus-visible{outline:2px solid var(--info);outline-offset:4px}.sport-load-details{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}.sport-load-details .ring{margin-bottom:8px}.sport-load-details p{overflow-wrap:anywhere}.v{background:var(--deep);border-radius:12px;padding:10px}.v b{display:block;font-size:12px;letter-spacing:1.2px;color:var(--muted)}
 .v .lv{font-size:22px;font-weight:900}.go{color:var(--good)}.easy{color:var(--warn)}.rest{color:var(--bad)}
 .v small{display:block;color:var(--text2);font-size:12px;margin-top:4px}
 .bars{display:grid;gap:6px}.brow{display:grid;grid-template-columns:140px 1fr 70px;gap:8px;align-items:center;font-size:13px}
 .btrack{position:relative;height:12px;background:var(--control);border-radius:6px;overflow:hidden}.btrack i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
 .btrack em{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff8}
 .brow span:last-child{text-align:right;color:var(--text2)}
 table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px;border-bottom:1px solid var(--line)} th{color:var(--muted)} td.r,th.r{text-align:right}
 .legend{font-size:12px;color:var(--text2);display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
 svg.chart{width:100%;height:auto;display:block}
 .pie{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.pie svg{width:140px;height:140px;flex:none}
 @media(max-width:560px){.brow{grid-template-columns:100px 1fr 56px}}
</style><link rel="stylesheet" href="/web/theme.css"><script>if(new URLSearchParams(location.search).get("embedded")==="1")document.documentElement.dataset.embedded="true";</script><script src="/web/theme.js"></script><script src="/web/energy-units.js"></script><script src="/web/work-rate.js"></script><script src="/web/fitness-workspace.js"></script><link rel="stylesheet" href="/web/work-rate.css"><script src="/web/fitness-charts.js"></script><link rel="stylesheet" href="/web/fitness-charts.css"></head><body class="fitness-landscape"><main><h1>Fitness Dashboard</h1><p class="sub"><a href="/coach#fitness">Coach</a> · <a href="/ride">Ride view</a></p>
<section id="work-rate-card" class="card"></section><p id="fitness-status" class="sub" role="status"></p>
<details id="lifting-records" class="card"><summary>Lifting records &amp; strength estimates</summary><div id="lifting-records-content"></div></details>
<section id="body-workload" class="card"></section>
<details id="calibration-tests" class="card"><summary>Calibration &amp; tests</summary><div id="calibration-primary"></div><div id="calibration-extra"></div></details>
<details id="watch-observations" class="card"><summary>Watch measurements</summary><div id="watch-summary-charts" class="fitness-chart-detail"></div><details><summary>Recorded measurements · by sport</summary><div id="watch-records"></div></details></details>
</main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const itab=(head,rows)=>rows.length?`<div style="overflow-x:auto"><table class="wr-ledger"><tr>${head.map((x,i)=>`<th${i?' class="r"':''}>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map((x,i)=>`<td${i?' class="r"':''}>${x??'–'}</td>`).join('')}</tr>`).join('')}</table></div>`:'';
const isec=s=>`${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`;
const ipct=v=>v==null?'–':(v>0?'+':'')+v+'%';
function insightBody(a){ let o='';
  const p=a.pauses; if(p&&p.count) o+=`<div class="sub">${p.count} pause${p.count>1?'s':''}, ${isec(p.seconds)} stopped (at ${p.at_min.map(m=>m+' min').join(', ')}).</div>`;
  if(a.swim){ const w=a.swim;
    o+=`<div>${esc(w.stroke)} · ${w.total_m} m · SWOLF ${w.swolf_avg} · ${w.strokes_avg} strokes a length${w.rate_avg?' · '+w.rate_avg+' strokes/min':''}</div>`
      +`<div class="sub">${w.broke_down?`Stroke first broke down ${w.broke_down.at_m} m in (${w.broke_down.at_min} min): SWOLF ${w.broke_down.swolf} against ${w.baseline_swolf} at the start.`:'The stroke held to the end.'}${w.rest_drop_60!=null?` Heart rate fell ${w.rest_drop_60} in the first minute of a rest (wrist in water: rough).`:''}</div>`
      +itab(['Set','m','SWOLF','Strokes','/100 m','±'],w.sets.map(s=>[s.set,s.metres,`${s.swolf_first}→${s.swolf_last}`,`${s.strokes_first}→${s.strokes_last}`,`${isec(s.pace_first)}→${isec(s.pace_last)}`,ipct(s.fade_pct)]))
      +w.sets.filter(s=>s.step).map(s=>`<div class="sub">Set ${s.set}: a sudden step at length ${s.step.length_in_set} (${s.step.at_m} m), SWOLF +${s.step.jump}: ${esc(s.step.what)}.</div>`).join(''); }
  if(a.run){ const r=a.run, d=r.drift;
    o+=`<div>${r.steps?r.steps.toLocaleString()+' steps · ':''}${r.watts??'–'} W · ${r.contact_ms??'–'} ms on the ground · ${r.vertical_ratio_pct??'–'}% bounce · ${r.step_length_m??'–'} m steps</div>`;
    if(d) o+=`<div class="sub">Last third against the first: pace ${ipct(d.speed_pct)}, heart rate ${ipct(d.hr_pct)}, bounce ${ipct(d.vertical_ratio_pct)}, step length ${ipct(d.step_length_pct)}${d.contact_pct!=null?', ground contact '+ipct(d.contact_pct):''}. ${d.pace_matched?(d.form_changed.length?'At the same pace: '+d.form_changed.join(', ')+'.':'Same pace, form held.'):'The pace changed, so form is not judged.'}</div>`;
    o+=itab(['Lap','Min','km','HR','W','Steps/min','Contact ms','Bounce %','Step m'],r.laps.map(l=>[l.lap,l.minutes,l.km,l.hr,l.watts,l.steps_min,l.contact_ms,l.vertical_ratio_pct,l.step_length_m]));
    o+=itab(['From min','Pace /km','HR','W','Steps/min','Bounce %','Step m'],r.five_min.map(f=>[f.from_min,isec(f.pace_min_km*60),f.hr,f.watts,f.steps_min,f.vertical_ratio_pct,f.step_length_m])); }
  if(a.ride){ const r=a.ride;
    o+=`<div>${r.work_kj} kJ of work${r.cadence?' · '+r.cadence+' rpm':''}${r.np?' · '+r.np+' W normalized':''}${r.avg_hr?' · '+r.avg_hr+' bpm':''}</div>`;
    const bits=[]; if(r.start_hr) bits.push(`Opening minutes: ${r.start_hr} bpm at ${r.start_watts} W${r.start_hr_diff!=null?` (${r.start_hr_diff>0?'+':''}${r.start_hr_diff} against your usual)`:''}.`);
    if(r.recovery_60!=null) bits.push(`Heart rate fell ${r.recovery_60} in the minute after a hard effort (${r.efforts.length} effort${r.efforts.length>1?'s':''}).`);
    if(r.drift_read) bits.push(r.drift_read); else if(r.decoupling_pct!=null) bits.push(`Drift ${r.decoupling_pct}% - too short or too uneven a ride to judge.`);
    if(bits.length) o+=`<div class="sub">${bits.map(esc).join(' ')}</div>`; }
  if(a.kcal) o+=`<div class="sub">${a.kcal} kcal${a.wrist_temp_c!=null?' · wrist '+a.wrist_temp_c+' °C':''}</div>`;
  return o||'<div class="sub">Heart rate only.</div>'; }

addEventListener('fitness-readings',e=>{
 const L=e.detail.load,T=e.detail.today;
 FitnessCharts.watch($('watch-summary-charts'),L);
 $('calibration-primary').innerHTML=Object.values(T.calibration?.capacities||{}).map(v=>`<p><b>${esc(v.name)}</b> · ${v.value==null?'Not measured':esc(v.value)+' '+esc(v.unit||'')}<br><span class="sub">${esc(v.source||'No source recorded')}${v.last_test?' · tested '+esc(v.last_test):''} · confidence ${Math.round((v.confidence||0)*100)}%</span></p>`).join('')||'<p>No test estimates recorded.</p>';
 const groups={};for(const a of L.insights?.activities||[])(groups[a.sport]??=[]).push(a);
 const names={swim:'Swimming',run:'Running',bike:'Cycling',gym:'Gym',walk:'Walking'};
 $('watch-records').innerHTML=Object.entries(groups).map(([k,aa])=>`<details class="wr-report"><summary>${esc(names[k]||k)} · ${aa.length} sessions</summary>${aa.map(a=>`<details class="wr-report"><summary>${esc(a.date)} · ${a.minutes} min</summary>${insightBody(a)}</details>`).join('')}</details>`).join('')||'<p>No watch measurements recorded.</p>';
});
addEventListener('visibilitychange',()=>{if(!document.hidden)FitnessWorkspace.refresh();});
addEventListener('message',e=>{if(e.origin===location.origin&&e.source===parent&&e.data?.type==='hub-data-updated')FitnessWorkspace.refresh();});
FitnessWorkspace.refresh();setInterval(()=>{if(!document.hidden)FitnessWorkspace.refresh();},60000);
</script><script src="/web/fitness-backdrop.js"></script></body></html>
