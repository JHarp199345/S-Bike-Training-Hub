<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S-Bike Training Hub · Ride</title><link rel="stylesheet" href="/web/theme.css"><script src="/web/theme.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg,#0b1017);color:var(--text,#eef3f7);font:15px system-ui}body{display:flex;flex-direction:column}header{flex:none;display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--card,#14202b);border-bottom:1px solid var(--line,#31404a);flex-wrap:wrap}a{color:var(--info,#8dcaff);text-decoration:none}nav{display:flex;gap:14px;flex-wrap:wrap}select{background:var(--control,#253348);color:inherit;padding:9px 12px;border:1px solid var(--line,#31404a);border-radius:8px;font:inherit}label{display:flex;align-items:center;gap:7px}.visual{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}#stage{flex:1;min-height:0;border:0;width:100%;background:#111}#hint{margin:0;padding:5px 16px;font-size:12px;color:var(--muted,#abb7c3)}#ride-status{font-size:12px;color:var(--muted,#abb7c3)}input{width:17px;height:17px}#map-warning{padding:10px 16px;color:#ffc978}#map-warning[hidden]{display:none}@media(max-width:650px){header{gap:10px;padding:8px 10px}.visual{margin-left:0}nav{font-size:13px;gap:10px}#hint{display:none}}
</style></head><body><header><strong>Ride</strong><nav aria-label="Hub navigation"><a href="/coach#today">Today</a><a href="/coach#plan">Training plan</a><a href="/plan">Plan a ride</a><a href="/coach#fitness">Fitness</a><a href="/coach#progress">Progress</a><a href="/panel">Settings</a></nav><div class="visual"><label>Scenery<select id="scenery"><option value="map">Real map · 3D</option><option value="game">Animal game</option><option value="pixel">Animal game · 8-bit</option><option value="haunted">Haunted graveyard · 3D</option></select></label><label><input id="default-view" type="checkbox">Default</label></div><span id="ride-status" role="status">Connecting…</span></header><p id="hint">Your workout watts or route hills control the ride. Scenery changes only what you see. Recorded rides feed the Hub’s load and progress pages.</p><div id="map-warning" hidden role="status"></div><iframe id="stage" title="Ride scenery and controls" allow="fullscreen" allowfullscreen></iframe><script>
const $=id=>document.getElementById(id),views=['map','game','pixel','haunted'];let defaultView=null;try{const saved=localStorage.getItem('hub.ride.default');if(views.includes(saved))defaultView=saved;}catch(e){}const requested=new URLSearchParams(location.search).get('view');let current=views.includes(requested)?requested:(defaultView||'haunted');
function show(view){current=view;$('scenery').value=view;$('default-view').checked=view===defaultView;$('stage').src=view==='map'?'/ride/map':'/ride/game?scene='+view;history.replaceState(null,'','/ride?view='+view);}
$('scenery').onchange=()=>show($('scenery').value);$('default-view').onchange=()=>{if($('default-view').checked){defaultView=current;try{localStorage.setItem('hub.ride.default',current);}catch(e){}}else if(defaultView===current){try{localStorage.removeItem('hub.ride.default');}catch(e){}defaultView=null;}$('default-view').checked=current===defaultView;};
addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==$('stage').contentWindow)return;if(e.data?.type==='hub-ride-view'&&views.includes(e.data.view))show(e.data.view);});
async function poll(){try{const r=await fetch('/status');if(!r.ok)throw Error();const s=await r.json();$('ride-status').textContent=s.test?'FTP test active':s.workout?'Workout · '+s.workout.name:s.route?'Route · '+s.route.name:s.no_bike?'Bike disconnected · preview available':s.bike?'Bike connected · recording':'Waiting for bike';}catch(e){$('ride-status').textContent='Hub connection lost · reconnecting';}}
fetch('/api/map/status').then(r=>r.json()).then(s=>{if(!s.engine||!s.maps){$('map-warning').hidden=false;$('map-warning').textContent=!s.engine?'Map tools are missing. Run your system’s setup again; game scenery remains available.':'Map tiles are not installed yet. Saved routes and game scenery remain available; install your region in Settings.';}}).catch(()=>{});show(current);poll();setInterval(poll,2000);
</script></body></html>
