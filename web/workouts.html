<!doctype html><html><head><meta charset="utf-8"><title>S-Bike Hub · Workouts</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
 :root{color-scheme:dark}
 [hidden]{display:none!important}
 body{margin:0;background:#0b0f14;color:#eef1f5;font:15px/1.4 -apple-system,Roboto,"Helvetica Neue",sans-serif}
 main{max-width:1100px;margin:0 auto;padding:20px 16px 60px;display:grid;grid-template-columns:300px 1fr;gap:18px}
 header{grid-column:1/-1} h1{font-size:28px;margin:0} .sub{color:#8b98a8} a{color:#60a5fa}
 h2{font-size:14px;letter-spacing:1.2px;color:#8b98a8;margin:0 0 8px}
 .card{background:#151b23;border-radius:14px;padding:12px}
 button{background:#1f2937;color:#eef1f5;border:0;border-radius:10px;padding:9px 12px;font-size:14px;font-weight:700;cursor:pointer}
 button.go{background:#16a34a} button.blue{background:#2563eb} button.warn{background:#7f1d1d} button.purple{background:#9333ea}
 button:disabled{opacity:.5;cursor:default}
 .w{background:#151b23;border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer;border:2px solid transparent}
 .w.sel{border-color:#2563eb} .w b{display:block} .w small{color:#8b98a8}
 .w canvas{width:100%;height:34px;display:block;margin-top:6px}
 input,select,textarea{background:#0b0f14;color:#eef1f5;border:1px solid #2a3441;border-radius:9px;padding:8px 9px;font-size:15px;font-family:inherit}
 input.name{width:100%;box-sizing:border-box;font-size:20px;font-weight:700}
 textarea{width:100%;box-sizing:border-box;min-height:44px;margin-top:8px;resize:vertical}
 .blk{background:#0f141b;border:1px solid #1f2733;border-left:6px solid var(--c,#374151);border-radius:12px;padding:10px;margin:8px 0}
 .blk .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
 .blk .top b{font-size:14px;letter-spacing:.5px}
 .blk .tools button{padding:5px 9px;font-size:13px;margin-left:4px}
 .fields{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
 .f{display:flex;align-items:center;gap:6px;color:#b7c1cd;font-size:14px}
 .f input{width:74px}.f input.t{width:66px}
 .f em{font-style:normal;color:#8b98a8;font-size:12px;min-width:44px}
 .adds{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
 #chart{width:100%;height:170px;display:block}
 .tot{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
 .tot div{background:#0f141b;border-radius:10px;padding:8px;text-align:center}
 .tot b{display:block;font-size:20px}.tot span{font-size:11px;letter-spacing:1px;color:#8b98a8}
 .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
 #msg{min-height:20px;margin-top:8px;color:#fbbf24}
 @media (max-width:760px){ main{grid-template-columns:1fr} .tot{grid-template-columns:repeat(3,1fr)} }
</style></head><body><main>
<header><h1>Workout builder</h1><div class="sub">Everything is % of your FTP (<b id="ftp">–</b> W), so workouts grow with you ·
 <a href="/panel">Panel</a> · <a href="/ride">Ride view</a> · <a href="/fitness">Fitness</a></div></header>
<section>
 <h2>YOUR WORKOUTS</h2>
 <button class="blue" id="new" style="width:100%;margin-bottom:8px">+ New workout</button>
 <select id="tpl" style="width:100%;margin-bottom:12px"><option value="">Start from a template…</option></select>
 <div id="list"></div>
</section>
<section>
 <div class="card">
  <input class="name" id="name" placeholder="Workout name" maxlength="80">
  <textarea id="note" placeholder="Notes (what it's for, when in the plan)" maxlength="300"></textarea>
  <canvas id="chart"></canvas>
  <div class="tot"><div><b id="tmin">–</b><span>TIME</span></div><div><b id="ttss">–</b><span>LOAD</span></div>
   <div><b id="tif">–</b><span>INTENSITY</span></div><div><b id="tavg">–</b><span>AVG WATTS</span></div><div><b id="tkcal">–</b><span>KCAL</span></div></div>
  <div id="blocks"></div>
  <div class="adds"><button data-add="steady">+ Steady</button><button data-add="ramp">+ Ramp</button><button data-add="intervals">+ Intervals</button></div>
  <div class="acts"><button class="go" id="save">Save</button><button id="saveas">Save as new</button>
   <button class="purple" id="ride">▶ Ride it now</button><button class="warn" id="del">Delete</button></div>
  <div id="msg"></div>
 </div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const ZONES=[[55,'#6b7280','recovery'],[75,'#3b82f6','endurance'],[90,'#22c55e','tempo'],[105,'#eab308','threshold'],[120,'#f97316','VO2max'],[999,'#ef4444','anaerobic']];
const zone=p=>ZONES.find(z=>p<z[0]);
const TEMPLATES={
 'Zone 2 - 60 min':[{type:'ramp',minutes:10,from:40,to:60},{type:'steady',minutes:40,pct:62},{type:'steady',minutes:10,pct:45}],
 'Sweet spot 3×10':[{type:'ramp',minutes:10,from:40,to:70},{type:'intervals',times:3,on:{minutes:10,pct:90},off:{minutes:5,pct:50}},{type:'steady',minutes:10,pct:45}],
 'Threshold 2×20':[{type:'ramp',minutes:12,from:40,to:75},{type:'intervals',times:2,on:{minutes:20,pct:97},off:{minutes:8,pct:50}},{type:'steady',minutes:10,pct:45}],
 'VO2max 5×3':[{type:'ramp',minutes:12,from:40,to:75},{type:'intervals',times:5,on:{minutes:3,pct:112},off:{minutes:3,pct:50}},{type:'steady',minutes:10,pct:45}],
 'Over-unders 3×(4×1+1)':[{type:'ramp',minutes:10,from:40,to:75},{type:'intervals',times:12,on:{minutes:1,pct:105},off:{minutes:1,pct:90}},{type:'steady',minutes:10,pct:45}],
 'Cadence builder (high-rpm spin-ups)':[{type:'steady',minutes:10,pct:50},{type:'intervals',times:6,on:{minutes:1,pct:60},off:{minutes:2,pct:50}},{type:'steady',minutes:10,pct:50}],
 'Recovery spin - 30 min':[{type:'steady',minutes:30,pct:45}],
};
let ftp=180, list=[], cur=null, blocks=[], prevT=0;
const fmtT=m=>{ const s=Math.round(m*60); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
const parseT=v=>{ v=String(v).trim(); if(v.includes(':')){ const [a,b]=v.split(':'); return (+a||0)+(+b||0)/60; } return +v; };
const W=p=>Math.round(p/100*ftp);

async function loadList(sel){ const j=await (await fetch('/api/workouts')).json(); ftp=j.ftp; list=j.workouts; $('ftp').textContent=ftp;
  $('list').innerHTML=list.map((w,i)=>`<div class="w${sel===w.id?' sel':''}" data-i="${i}"><b>${esc(w.name)}</b><small>${Math.round(w.stats.minutes)} min · load ${w.stats.tss} · IF ${w.stats.if.toFixed(2)}</small><canvas></canvas></div>`).join('');
  $('list').querySelectorAll('.w').forEach(el=>{ const w=list[+el.dataset.i]; el.onclick=()=>open(w); mini(el.querySelector('canvas'),w.steps); });
  if(!cur&&list.length) open(list[0]); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function open(w){ cur=w; $('name').value=w.name; $('note').value=w.note||''; blocks=JSON.parse(JSON.stringify(w.blocks)); render();
  document.querySelectorAll('.w').forEach(el=>el.classList.toggle('sel',list[+el.dataset.i]?.id===w.id)); $('del').disabled=false; }
function fresh(name,bl){ cur=null; $('name').value=name; $('note').value=''; blocks=bl; render(); $('del').disabled=true;
  document.querySelectorAll('.w').forEach(el=>el.classList.remove('sel')); $('name').focus(); }
$('new').onclick=()=>fresh('My workout',[{type:'steady',minutes:10,pct:50}]);
$('tpl').innerHTML+=Object.keys(TEMPLATES).map(k=>`<option>${k}</option>`).join('');
$('tpl').onchange=()=>{ const k=$('tpl').value; if(k) fresh(k,JSON.parse(JSON.stringify(TEMPLATES[k]))); $('tpl').value=''; };

function pctField(label,obj,key){ return `<label class="f">${label}<input type="number" min="20" max="250" step="1" value="${obj[key]}" data-k="${key}">% <em>${W(obj[key])} W</em></label>`; }
function tField(label,obj,key){ return `<label class="f">${label}<input class="t" value="${fmtT(obj[key])}" data-k="${key}" data-t="1" inputmode="decimal"></label>`; }
function render(){
  $('blocks').innerHTML=blocks.map((b,i)=>{ let body='', c;
    if(b.type==='steady'){ c=zone(b.pct)[1]; body=tField('for',b,'minutes')+pctField('at',b,'pct'); }
    if(b.type==='ramp'){ c=zone(Math.max(b.from,b.to))[1]; body=tField('over',b,'minutes')+pctField('from',b,'from')+pctField('to',b,'to'); }
    if(b.type==='intervals'){ c=zone(b.on.pct)[1];
      body=`<label class="f"><input type="number" min="1" max="50" value="${b.times}" data-k="times" style="width:60px">×</label>`
        +`<span data-sub="on">${tField('on',b.on,'minutes')}${pctField('at',b.on,'pct')}</span>`
        +`<span data-sub="off">${tField('easy',b.off,'minutes')}${pctField('at',b.off,'pct')}</span>`; }
    const title={steady:'STEADY',ramp:'RAMP',intervals:'INTERVALS'}[b.type];
    return `<div class="blk" style="--c:${c}" data-i="${i}"><div class="top"><b>${title}</b><span class="tools">
      <button data-a="up" ${i?'':'disabled'}>↑</button><button data-a="down" ${i<blocks.length-1?'':'disabled'}>↓</button><button data-a="dup">⧉</button><button data-a="rm">✕</button></span></div>
      <div class="fields">${body}</div></div>`; }).join('');
  $('blocks').querySelectorAll('.blk').forEach(el=>{ const i=+el.dataset.i;
    el.querySelectorAll('input').forEach(inp=>inp.onchange=inp.oninput=()=>{ const sub=inp.closest('[data-sub]')?.dataset.sub, o=sub?blocks[i][sub]:blocks[i];
      const v=inp.dataset.t?parseT(inp.value):+inp.value; if(!isFinite(v)) return; o[inp.dataset.k]=v;
      const em=inp.parentElement.querySelector('em'); if(em) em.textContent=W(v)+' W'; preview(); if(inp.type==='number'&&inp.dataset.k!=='times') el.style.setProperty('--c',zone(v)[1]); });
    el.querySelectorAll('[data-a]').forEach(btn=>btn.onclick=()=>{ const a=btn.dataset.a;
      if(a==='rm') blocks.splice(i,1); if(a==='dup') blocks.splice(i+1,0,JSON.parse(JSON.stringify(blocks[i])));
      if(a==='up'&&i) [blocks[i-1],blocks[i]]=[blocks[i],blocks[i-1]]; if(a==='down'&&i<blocks.length-1) [blocks[i+1],blocks[i]]=[blocks[i],blocks[i+1]];
      render(); }); });
  preview();
}
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{ const t=b.dataset.add;
  blocks.push(t==='steady'?{type:'steady',minutes:10,pct:65}:t==='ramp'?{type:'ramp',minutes:10,from:50,to:80}:{type:'intervals',times:4,on:{minutes:4,pct:95},off:{minutes:3,pct:50}}); render(); });

let pT=0; function preview(){ clearTimeout(pT); pT=setTimeout(async()=>{
  const r=await fetch('/api/workouts/preview',{method:'POST',body:JSON.stringify({blocks})}); const j=await r.json();
  if(!r.ok){ $('msg').textContent=j.error; $('msg').dataset.err=1; return; } if($('msg').dataset.err){ $('msg').textContent=''; delete $('msg').dataset.err; }
  draw($('chart'),j.steps,true); const s=j.stats; $('tmin').textContent=Math.floor(s.minutes/60)?Math.floor(s.minutes/60)+'h '+Math.round(s.minutes%60)+'m':Math.round(s.minutes)+' min';
  $('ttss').textContent=s.tss; $('tif').textContent=s.if.toFixed(2); $('tavg').textContent=s.avg_w+' W'; $('tkcal').textContent=s.kcal; },200); }
function draw(c,steps,axes){ const dpr=devicePixelRatio||1, w=c.clientWidth, h=c.clientHeight; c.width=w*dpr; c.height=h*dpr;
  const g=c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h); if(!steps.length) return;
  const L=axes?34:0, B=axes?16:0, total=steps.reduce((a,s)=>a+s.minutes,0), top=Math.max(130,...steps.map(s=>s.pct))*1.05;
  const X=m=>L+m/total*(w-L), Y=p=>(h-B)-p/top*(h-B-4);
  if(axes){ g.font='11px -apple-system,Roboto'; g.fillStyle='#8b98a8'; g.textAlign='right'; g.textBaseline='middle';
    for(const p of [50,75,100]){ g.strokeStyle=p===100?'rgba(234,179,8,.5)':'rgba(255,255,255,.07)'; g.setLineDash(p===100?[4,4]:[]);
      g.beginPath(); g.moveTo(L,Y(p)); g.lineTo(w,Y(p)); g.stroke(); g.setLineDash([]); g.fillText(p===100?'FTP':p+'%',L-4,Y(p)); } }
  let t=0; for(const s of steps){ g.fillStyle=zone(s.pct)[1]; g.fillRect(X(t),Y(s.pct),Math.max(1,X(t+s.minutes)-X(t)-0.5),(h-B)-Y(s.pct)); t+=s.minutes; }
  if(axes){ g.fillStyle='#8b98a8'; g.textAlign='center'; const step=total>90?30:total>40?10:5;
    for(let m=0;m<=total;m+=step) g.fillText(m+'m',X(m),h-6); } }
function mini(c,steps){ draw(c,steps,false); }

async function save(asNew){ const body={id:asNew?null:cur?.id,name:$('name').value,note:$('note').value,blocks};
  const r=await fetch('/api/workouts/save',{method:'POST',body:JSON.stringify(body)}); const j=await r.json();
  if(!r.ok){ $('msg').textContent=j.error; $('msg').dataset.err=1; return null; } delete $('msg').dataset.err; $('msg').textContent='Saved.'; cur={id:j.id}; await loadList(j.id);
  const w=list.find(x=>x.id===j.id); if(w) open(w); $('msg').textContent='Saved - it\'s in the panel\'s workout list too.'; return j.id; }
$('save').onclick=()=>save(false); $('saveas').onclick=()=>save(true);
$('del').onclick=async()=>{ if(!cur?.id||!confirm(`Delete "${$('name').value}"?`)) return;
  const r=await fetch('/api/workouts/delete/'+cur.id,{method:'POST'}); if(r.ok){ cur=null; await loadList(); $('msg').textContent='Deleted.'; } };
$('ride').onclick=async()=>{ const id=await save(false); if(!id) return;
  const r=await fetch('/api/workouts/start/'+id,{method:'POST'}); if(r.ok) location.href='/course'; else $('msg').textContent=(await r.json()).error; };
addEventListener('resize',()=>{ render(); document.querySelectorAll('.w').forEach(el=>mini(el.querySelector('canvas'),list[+el.dataset.i].steps)); });
loadList();
</script></body></html>
