name: Publish to MCP Registry

# Lists the release in the official MCP registry (server.json) once its PyPI package is live; directories such as
# MCPRush read the registry. Runs after each successful "Publish to PyPI", or by hand. Signs in with GitHub OIDC
# (no stored passwords or tokens). server.json must already carry the release's version.
on:
  workflow_run:
    workflows: ["Publish to PyPI"]
    types: [completed]
  workflow_dispatch:

jobs:
  registry:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the PyPI version to appear
        run: |
          version=$(python3 -c "import json; print(json.load(open('server.json'))['version'])")
          for i in $(seq 1 30); do
            curl -sf "https://pypi.org/pypi/s-bike-training-hub/$version/json" > /dev/null && exit 0
            sleep 20
          done
          echo "s-bike-training-hub $version is not on PyPI" && exit 1
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
