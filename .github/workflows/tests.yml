name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONUTF8: "1"        # Windows reads files as cp1252 otherwise; the hub's entry points relaunch in UTF-8 themselves
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (macOS - everything setup.sh installs)
        if: runner.os == 'macOS'
        run: pip install -r requirements.txt
      - name: Install (Linux - setup-linux.sh, as a person would run it)
        if: runner.os == 'Linux'
        run: |
          bash setup-linux.sh --no-bike --no-start
          pip install -r requirements.txt
      - name: Install (Windows - setup.ps1, as a person would run it)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./setup.ps1 -NoBike -NoStart
          if (-not (Test-Path .venv\Scripts\python.exe)) { throw "setup.ps1 did not create the environment" }
          .venv\Scripts\python.exe -c "from bless import BlessServer; import bleak; print('bless and bleak import on Windows')"
          python -m pip install -r requirements.txt
          python -m pip install --no-deps bless==0.3.0
          python -m pip install pywin32
      - name: Bike setup - matched and unrecognized bikes, guided check, assistant tools
        run: python tests/test_bike_setup.py
      - name: The hub starts in no-bike mode and the bike setup answers over HTTP
        shell: bash
        run: |
          S_BIKE_SIM=1 python bridge.py --no-bike --no-remote --port 18890 > hub.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:18890/api/bike/status && break; sleep 1; done
          curl -sf -X POST localhost:18890/api/bike/scan -d '{}' | python -c "import json,sys; d=json.load(sys.stdin); s={o['device']['name']:o['status'] for o in d['found']}; print(s); assert s['MRK-S29-A1B2']=='known' and s['KICKR BIKE 7F3A']=='standard' and s['ACME IC7-0042']=='unrecognized'"
          curl -sf localhost:18890/welcome -o welcome.html
          grep -q 'get my bike working' welcome.html
          kill %1 || true
          cat hub.log
      - name: Every test
        run: python tests/run_all.py
      - name: Failed tests, as annotations
        if: failure()
        shell: bash
        run: |
          if [ -f test-results.txt ]; then
            (grep -v '^PASS' test-results.txt || true) | cut -c1-3000 | sed 's/^/::error::/'
            echo "::error::$(grep -c '^PASS' test-results.txt || true) passed; last line: $(tail -n 1 test-results.txt | cut -c1-300)"
          else echo "::error::no test-results.txt: the test runner itself failed to start"; fi
